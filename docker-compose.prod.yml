# Sunucu: paylaşılan altyapıya bağlanma.
#
# Sunucuda zaten ~/infra altında ortak bir Caddy ve ortak bir Postgres çalışıyor,
# ikisi de `web` adlı dış ağda. RandaSports kendi Caddy'sini ve Postgres'ini
# getirmiyor — aynı ağa katılıyor:
#
#   * api ve worker, veritabanına `infra-postgres-1` adıyla ulaşıyor
#     (.env içindeki DB_HOST bunu söylüyor),
#   * Caddy de siteye `randasports-web:3000` adıyla ulaşıyor.
#
# Caddy tarafındaki site bloğu ~/infra/caddy/Caddyfile içinde duruyor, bu
# depoda değil — orası bütün projelerin ortak dosyası.

services:
  api:
    networks: [default, web]

  worker:
    networks: [default, web]

  web:
    networks: [default, web]

networks:
  # `docker network create web` ile zaten var; compose onu oluşturmuyor, buluyor.
  web:
    external: true
