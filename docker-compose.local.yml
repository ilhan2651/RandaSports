# Yerel geliştirme: projenin kendi Postgres'i.
# Sunucuda kullanılmıyor, orada paylaşılan infra veritabanı var.

services:
  postgres:
    image: postgres:17
    container_name: randasports-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Başına 127.0.0.1 yazmazsan Docker portu doğrudan internete açar ve
    # güvenlik duvarını da atlar.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
