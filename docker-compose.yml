# Uygulamanın kendisi: API, worker ve site. Veritabanı burada DEĞİL — yerelde ve
# sunucuda farklı yerden geliyor, onu ortam dosyaları belirliyor:
#
#   Yerelde   .env içinde  COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
#             -> kendi Postgres konteynerini de kaldırıyor.
#
#   Sunucuda  .env içinde  COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#             -> paylaşılan infra Postgres'ine ve Caddy'sine bağlanıyor.
#
# İki yerde de çalıştırma komutu aynı:  docker compose up -d --build
#
# Sırlar bu dosyada değil, yanındaki .env dosyasında (.gitignore'da).

name: randasports

services:
  api:
    build:
      context: ./backend
      dockerfile: RandaSports.Api/Dockerfile
    container_name: randasports-api
    restart: unless-stopped
    environment:
      # Çift alt çizgi .NET yapılandırmasında iki nokta yerine geçiyor:
      # ConnectionStrings__Default  ->  ConnectionStrings:Default
      ConnectionStrings__Default: "Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Jwt__Key: ${JWT_KEY}
      # Boş bırakılırsa yönetici tohumlaması atlanıyor. İlk girişten sonra
      # bu üçünü .env'den boşaltmak en temizi.
      AdminSeed__Email: ${ADMIN_EMAIL:-}
      AdminSeed__Password: ${ADMIN_PASSWORD:-}
      AdminSeed__FullName: ${ADMIN_FULLNAME:-}
      Cors__AllowedOrigins__0: ${SITE_URL}
    # Dışarı açılmıyor; yalnızca sunucunun kendisinden curl ile bakmak için.
    ports:
      - "127.0.0.1:5122:8080"

  worker:
    build:
      context: ./backend
      dockerfile: RandaSports.Worker/Dockerfile
    container_name: randasports-worker
    restart: unless-stopped
    depends_on:
      # Migration'ları API uyguluyor; worker şemayı hazır bulsun diye sonra kalkıyor.
      api:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Gemini__ApiKey: ${GEMINI_API_KEY}
      ApiSports__ApiKey: ${APISPORTS_API_KEY}

      # Tarama ve işleme hızı. Yeniden derlemeden ayarlanabilsin diye dışarı
      # açıldı: kanal sayısı ya da kota değiştiğinde .env'i düzenleyip
      # `docker compose up -d worker` demek yetiyor. Boş bırakılan değer için
      # koddaki varsayılan geçerli.
      VideoDiscovery__BatchSize: ${DISCOVERY_BATCH_SIZE:-4}
      VideoDiscovery__IntervalMinutes: ${DISCOVERY_INTERVAL_MINUTES:-30}
      VideoDiscovery__RecheckMinutes: ${DISCOVERY_RECHECK_MINUTES:-120}
      VideoDiscovery__MaxDurationSeconds: ${DISCOVERY_MAX_DURATION_SECONDS:-3600}
      OpinionExtraction__BatchSize: ${EXTRACTION_BATCH_SIZE:-2}
      OpinionExtraction__IntervalMinutes: ${EXTRACTION_INTERVAL_MINUTES:-20}
      QuoteCheck__BatchSize: ${QUOTE_CHECK_BATCH_SIZE:-10}
      QuoteCheck__IntervalMinutes: ${QUOTE_CHECK_INTERVAL_MINUTES:-10}

  web:
    build:
      context: ./frontend
    container_name: randasports-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # Site API'ye Docker ağı üzerinden gidiyor. Bu adres tarayıcıya hiç
      # ulaşmıyor: bütün çağrılar sunucu bileşenlerinden yapılıyor.
      API_BASE_URL: http://api:8080
      SITE_URL: ${SITE_URL}
    ports:
      - "127.0.0.1:3000:3000"
